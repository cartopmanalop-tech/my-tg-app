<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org"></script>
    <style>
        body { background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        img#avatar { width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--tg-theme-button-color); }
        .balance { font-size: 24px; margin: 20px 0; font-weight: bold; }
        button { padding: 15px 30px; font-size: 18px; background: var(--tg-theme-button-color, #248bcf); color: var(--tg-theme-button-text-color, #fff); border: none; border-radius: 15px; cursor: pointer; }
        button:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <img id="avatar" src="" alt="Ava">
    <h2 id="username">Загрузка...</h2>
    <div class="balance">Скорлупки: <span id="score">100</span></div>
    <button onclick="clickEgg()">Собрать скорлупку!</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // Развернуть на весь экран

        let score = 100;
        let user = tg.initDataUnsafe?.user;

        // Ставим данные из Телеграм
        if (user) {
            document.getElementById('username').innerText = user.first_name + (user.last_name ? " " + user.last_name : "");
            if (user.photo_url) {
                document.getElementById('avatar').src = user.photo_url;
            } else {
                document.getElementById('avatar').src = "https://ui-avatars.com" + user.first_name;
            }
        }

        function clickEgg() {
            score++;
            document.getElementById('score').innerText = score;
            tg.HapticFeedback.impactOccurred('medium'); // Вибрация при клике
        }
    </script>
</body>
</html>
