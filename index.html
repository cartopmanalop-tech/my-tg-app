<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Убедитесь, что эта строка загружается первой -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <title>Коллекционер карт</title>
    <style>
        body { background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .card-deck { display: flex; flex-wrap: wrap; justify-content: center; margin-bottom: 20px; }
        .card { width: 100px; height: 150px; background: var(--tg-theme-secondary-bg-color, #f0f0f0); margin: 5px; border-radius: 10px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 8px rgba(0,0,0,0.1); font-size: 30px; }
        .card.owned { background: var(--tg-theme-button-color, #007bff); color: var(--tg-theme-button-text-color, #fff); }
        /* Добавляем курсор, чтобы Safari знал, что элемент кликабельный */
        button, .card-deck { cursor: pointer; } 
    </style>
</head>
<body>
    <h1>Моя коллекция карт</h1>
    <div id="cardDeck" class="card-deck"></div>
    <p>Всего карт: <span id="cardCount">0</span> / 5</p>
    <!-- Заменили onclick на ontouchstart -->
    <button ontouchstart="revealCard()">Получить новую карту</button>

    <script>
        let tg = window.Telegram.WebApp;
        // Добавили слушатель события готовности
        tg.onEvent('main_button_pressed', checkStatus);
        tg.ready();
        tg.expand();
        
        const cards = ['⭐', '🌙', '☀️', '💧', '🔥'];
        let ownedCards = JSON.parse(localStorage.getItem('ownedCards')) || [];
        const cardDeckElement = document.getElementById('cardDeck');
        const cardCountElement = document.getElementById('cardCount');

        function renderDeck() {
            cardDeckElement.innerHTML = '';
            cards.forEach(card => {
                const cardElement = document.createElement('div');
                cardElement.classList.add('card');
                if (ownedCards.includes(card)) {
                    cardElement.classList.add('owned');
                    cardElement.innerText = card;
                } else {
                    cardElement.innerText = '?';
                }
                cardDeckElement.appendChild(cardElement);
            });
            cardCountElement.innerText = ownedCards.length;
        }

        function revealCard() {
            if (ownedCards.length === cards.length) {
                tg.showPopup({ title: "Ура!", message: "Вы собрали всю коллекцию!" });
                return;
            }

            let newCard;
            do {
                const randomIndex = Math.floor(Math.random() * cards.length);
                newCard = cards[randomIndex];
            } while (ownedCards.includes(newCard));

            ownedCards.push(newCard);
            localStorage.setItem('ownedCards', JSON.stringify(ownedCards));
            renderDeck();
            tg.HapticFeedback.notificationOccurred('success');
            // Используем стандартную кнопку ТГ для отображения статуса
            tg.MainButton.setText(`Получена карта: ${newCard}`).show(); 
        }
        
        function checkStatus() {
             tg.showPopup({title: "Статус коллекции", message: `Собрано: ${ownedCards.length} карт.`});
        }

        renderDeck(); // Рендерим коллекцию при загрузке
    </script>
</body>
</html>
